<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instalacja AV - Atacama (B&W Glitch Matrix)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* --- PARAMETRY KONFIGURACYJNE (CSS) --- */
        /* ========================================== */
        :root {
            --bg-color: #000000;
            --text-color: #e2e2e2; 
            --font-main: 'VT323', monospace;
            
            /* ROZMIAR Z TWOJEGO SCREENA */
            --grid-font-size: 22px; 
            --grid-line-height: 1.1; 
            
            /* Kolor przycisku PLAY */
            --play-bg: #e2e2e2;
            --play-text: #000000;

            /* FILTR DLA ZDJĘĆ - czarno-białe z podbitym kontrastem */
            --image-filter: grayscale(100%) contrast(140%);
        }
        /* ========================================== */

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html {
            width: 100vw; 
            height: 100vh;
            overflow: hidden; 
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #grid-container {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            text-shadow: 0 0 3px rgba(226, 226, 226, 0.4);
        }

        .data-block {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5ch; /* Usunięte marginesy, idealnie zbity blok */
            height: var(--grid-line-height);
            line-height: var(--grid-line-height);
            font-size: var(--grid-font-size);
            opacity: 0.8;
            transition: color 0.1s, opacity 0.1s;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Klasa aktywująca filtr czarno-biały dla zdjęć */
        .img-active {
            filter: var(--image-filter);
        }

        /* --- LOGIKA PULSUJĄCEGO CENTRUM (2 WARSTWY) --- */
        .center-wrapper {
            position: relative;
            cursor: pointer;
            opacity: 1 !important; 
        }

        .layer-glitch {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer-btn {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--play-bg);
            color: var(--play-text);
            text-shadow: none; 
            font-weight: bold;
            animation: slowPulse 5s infinite ease-in-out;
            pointer-events: none; 
        }

        @keyframes slowPulse {
            0%, 15% { opacity: 1; }      
            40%, 60% { opacity: 0; }     
            85%, 100% { opacity: 1; }    
        }
    </style>
</head>
<body>

    <script>
        // ==========================================
        // --- PARAMETRY KONFIGURACYJNE (JS) ---
        // ==========================================
        const AUDIO_FILE_URL = "Play Sustain instalacja 5_1.mp3"; 
        const BASE_NUMBER = "39000";
        
        // --- Parametry Animacji Cyfr ---
        const ACTIVE_THREADS = 40; 
        const ANIMATION_SPEED_MIN = 10; 
        const ANIMATION_SPEED_MAX = 40; 
        
        // --- Parametry Ukrytych Zdjęć ---
        const IMAGE_SHOW_TIME = 2000; // Ile milisekund widać zdjęcie
        const IMAGE_SPAWN_RATE = 800; // Co ile milisekund system losuje nowe zdjęcie
        // ==========================================

        const IMAGE_FILES = [];
        for (let i = 12; i <= 21; i++) {
            IMAGE_FILES.push(`Pustynia Atakama${i}.jpeg`);
        }
    </script>

    <div id="grid-container"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        
        const audio = new Audio();
        audio.src = AUDIO_FILE_URL;
        audio.loop = true;
        audio.crossOrigin = "anonymous";

        let activeIntervals = []; 
        let glitchableBlocks = [];
        let isPlaying = false;
        let btnLayerElement = null;

        function generateClassicMatrix() {
            activeIntervals.forEach(clearInterval);
            activeIntervals = [];
            glitchableBlocks = [];
            gridContainer.innerHTML = '';
            
            const testSpan = document.createElement('span');
            testSpan.className = 'data-block';
            testSpan.innerText = BASE_NUMBER;
            gridContainer.appendChild(testSpan);
            
            const blockW = testSpan.getBoundingClientRect().width;
            const blockH = testSpan.getBoundingClientRect().height;
            gridContainer.innerHTML = '';
            
            let cols = Math.ceil(window.innerWidth / blockW) + 2;
            let rows = Math.ceil(window.innerHeight / blockH) + 2;
            
            if (cols % 2 === 0) cols++;
            if (rows % 2 === 0) rows++;
            
            gridContainer.style.width = `${cols * blockW}px`;
            gridContainer.style.height = `${rows * blockH}px`;
            
            const totalBlocks = cols * rows;
            const centerIndex = Math.floor(totalBlocks / 2);
            
            for(let i = 0; i < totalBlocks; i++) {
                if (i === centerIndex) {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'data-block center-wrapper';
                    
                    const glitchLayer = document.createElement('span');
                    glitchLayer.className = 'layer-glitch';
                    glitchLayer.innerText = BASE_NUMBER;
                    
                    const btnLayer = document.createElement('span');
                    btnLayer.className = 'layer-btn';
                    btnLayer.innerText = isPlaying ? "STOP " : "PLAY ";
                    btnLayerElement = btnLayer; 
                    
                    wrapper.appendChild(glitchLayer);
                    wrapper.appendChild(btnLayer);
                    gridContainer.appendChild(wrapper);

                    runCenterGlitch(glitchLayer);

                    wrapper.addEventListener('click', () => {
                        if (!isPlaying) {
                            audio.play().catch(e => console.error(e));
                            btnLayerElement.innerText = "STOP ";
                        } else {
                            audio.pause();
                            btnLayerElement.innerText = "PLAY ";
                        }
                        isPlaying = !isPlaying;

                        const docEl = document.documentElement;
                        const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                        if (requestFS && !document.fullscreenElement) {
                            requestFS.call(docEl).catch(err => console.warn("FS:", err));
                        }
                    });

                } else {
                    const span = document.createElement('span');
                    span.className = 'data-block';
                    span.innerText = BASE_NUMBER;
                    span.dataset.busy = "false"; 
                    glitchableBlocks.push(span);
                    gridContainer.appendChild(span);
                }
            }
            
            startBackgroundEngines();
        }

        // --- SPECJALNY HAKER DLA CENTRUM ---
        function runCenterGlitch(element) {
            const targetVal = parseInt(BASE_NUMBER);
            function runCycle() {
                let currentVal = 0;
                const step = Math.floor(Math.random() * 3500) + 1111; 
                const frameRate = Math.floor(Math.random() * 20) + 15; 
                
                const interval = setInterval(() => {
                    currentVal += step;
                    if (currentVal >= targetVal) {
                        currentVal = targetVal;
                        element.innerText = currentVal.toString().padStart(5, '0');
                        element.style.color = "";
                        clearInterval(interval);
                        setTimeout(runCycle, Math.random() * 2000 + 500);
                    } else {
                        element.innerText = currentVal.toString().padStart(5, '0');
                        element.style.color = "#ffffff";
                    }
                }, frameRate);
                activeIntervals.push(interval);
            }
            runCycle();
        }

        // --- SILNIK HAKERSKI DLA TŁA (CYFRY) ---
        function glitchRandomBlock() {
            if(glitchableBlocks.length === 0) return;
            
            const randomBlock = glitchableBlocks[Math.floor(Math.random() * glitchableBlocks.length)];
            
            if(randomBlock.dataset.busy === "true") return;

            let currentVal = 0;
            const targetVal = parseInt(BASE_NUMBER);
            const step = Math.floor(Math.random() * 4000) + 1111; 
            const frameRate = Math.floor(Math.random() * (ANIMATION_SPEED_MAX - ANIMATION_SPEED_MIN)) + ANIMATION_SPEED_MIN;

            const interval = setInterval(() => {
                currentVal += step;
                if (currentVal >= targetVal) {
                    currentVal = targetVal;
                    clearInterval(interval);
                    setTimeout(glitchRandomBlock, Math.random() * 100);
                }
                randomBlock.innerText = currentVal.toString().padStart(5, '0');
                randomBlock.style.color = currentVal < targetVal ? "#ffffff" : "";
                randomBlock.style.opacity = currentVal < targetVal ? "1" : "0.8";
            }, frameRate);
            
            activeIntervals.push(interval);
        }

        // --- SILNIK ZDJĘĆ Z FILTREM ---
        function flashRandomImage() {
            if(glitchableBlocks.length === 0) return;
            
            const randomBlock = glitchableBlocks[Math.floor(Math.random() * glitchableBlocks.length)];
            if(randomBlock.dataset.busy === "true") return;

            randomBlock.dataset.busy = "true";
            
            const randomImg = IMAGE_FILES[Math.floor(Math.random() * IMAGE_FILES.length)];

            randomBlock.innerText = "";
            randomBlock.style.backgroundImage = `url('${randomImg}')`;
            
            // Dodajemy klasę aktywującą filtr (grayscale + contrast)
            randomBlock.classList.add('img-active');

            setTimeout(() => {
                randomBlock.style.backgroundImage = "none";
                randomBlock.classList.remove('img-active');

                let currentVal = 0;
                const targetVal = parseInt(BASE_NUMBER);
                const step = Math.floor(Math.random() * 4000) + 1111;
                const frameRate = Math.floor(Math.random() * (ANIMATION_SPEED_MAX - ANIMATION_SPEED_MIN)) + ANIMATION_SPEED_MIN;

                const countingInterval = setInterval(() => {
                    currentVal += step;
                    if (currentVal >= targetVal) {
                        currentVal = targetVal;
                        clearInterval(countingInterval);
                        randomBlock.dataset.busy = "false";
                    }
                    randomBlock.innerText = currentVal.toString().padStart(5, '0');
                    randomBlock.style.color = currentVal < targetVal ? "#ffffff" : "";
                    randomBlock.style.opacity = currentVal < targetVal ? "1" : "0.8";
                }, frameRate);
                
                activeIntervals.push(countingInterval);

            }, IMAGE_SHOW_TIME);
        }

        function startBackgroundEngines() {
            setTimeout(() => {
                for(let i = 0; i < ACTIVE_THREADS; i++) {
                    setTimeout(glitchRandomBlock, Math.random() * 1000);
                }
            }, 100);

            const imageSpawner = setInterval(flashRandomImage, IMAGE_SPAWN_RATE);
            activeIntervals.push(imageSpawner);
        }

        generateClassicMatrix();
        
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(generateClassicMatrix, 200);
        });
    </script>
</body>
</html>
