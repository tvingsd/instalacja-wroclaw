<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instalacja AV - Atacama (Ostateczny Matrix)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* --- PARAMETRY KONFIGURACYJNE (CSS) --- */
        /* ========================================== */
        :root {
            --bg-color: #000000;
            --text-color: #e2e2e2; 
            --font-main: 'VT323', monospace;
            
            /* Parametry cyfr */
            --grid-font-size: 22px; 
            --grid-line-height: 1.1; 
            
            /* Wygląd Przycisku (wielkość 5 znaków) */
            --play-bg: #e2e2e2;
            --play-text: #000000;

            /* ZDJĘCIA: Czarno-białe z podbitym kontrastem */
            --image-filter: grayscale(100%) contrast(140%);
            /* Czas płynnego przenikania zdjęć */
            --crossfade-duration: 3s; 
        }
        /* ========================================== */

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html {
            width: 100vw; height: 100vh;
            overflow: hidden; /* ODCINA WSZYSTKO CO WYCHODZI POZA EKRAN */
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
        }

        /* --- WARSTWA 1: SIATKA CYFR --- */
        #grid-container {
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            /* Generujemy matrycę 115% wielkości ekranu, żeby pokryła każdą szczelinę */
            width: 115vw; 
            height: 115vh;
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-content: center;
            text-shadow: 0 0 3px rgba(226, 226, 226, 0.4);
            z-index: 10;
        }

        .data-block {
            display: inline-flex; align-items: center; justify-content: center;
            width: 5ch; height: var(--grid-line-height); line-height: var(--grid-line-height);
            font-size: var(--grid-font-size);
            opacity: 0.8;
            transition: opacity 1.5s ease-out, color 0.1s; 
        }

        /* --- WARSTWA 2: PEŁNOEKRANOWE ZDJĘCIA --- */
        #slider-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; 
        }

        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0; 
            transition: opacity var(--crossfade-duration) ease-in-out;
            filter: var(--image-filter);
        }

        .slide.active {
            opacity: 1;
        }

        /* --- WARSTWA 3: PRZYCISK W CENTRUM --- */
        #playBtn {
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            z-index: 9999; 
            
            width: 5ch; height: 1em;
            display: flex; align-items: center; justify-content: center;
            
            background-color: var(--play-bg);
            color: var(--play-text);
            font-family: var(--font-main);
            font-size: var(--grid-font-size);
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            
            animation: pulseBtn 3s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        @keyframes pulseBtn {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; } 
        }
    </style>
</head>
<body>

    <script>
        // ==========================================
        // --- PARAMETRY KONFIGURACYJNE (JS) ---
        // ==========================================
        const AUDIO_FILE_URL = "Play Sustain instalacja 5_1.mp3"; 
        const BASE_NUMBER = "39000";
        
        // --- Cyfry (Tło) ---
        const ACTIVE_THREADS = 40; 
        const ANIMATION_SPEED_MIN = 10; 
        const ANIMATION_SPEED_MAX = 40; 
        
        // --- Pełnoekranowe Zdjęcia ---
        const DELAY_BEFORE_IMAGES = 3000; // 3 sekundy blackoutu przed zdjęciami
        const IMAGE_SHOW_TIME = 6000;     // Czas ekspozycji jednego zdjęcia (6 sekund)
        // ==========================================

        const IMAGE_FILES = [];
        for (let i = 12; i <= 21; i++) {
            IMAGE_FILES.push(`Pustynia Atakama${i}.jpeg`);
        }
    </script>

    <!-- UI -->
    <div id="playBtn">PLAY</div>
    <div id="grid-container"></div>
    
    <div id="slider-container">
        <div id="slideA" class="slide"></div>
        <div id="slideB" class="slide"></div>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const playBtn = document.getElementById('playBtn');
        const slideA = document.getElementById('slideA');
        const slideB = document.getElementById('slideB');
        
        const audio = new Audio();
        audio.src = AUDIO_FILE_URL;
        audio.loop = true;
        audio.crossOrigin = "anonymous";

        let activeIntervals = []; 
        let glitchableBlocks = [];
        let isPlaying = false;
        let isGridActive = true; 
        
        let currentSlide = slideA;
        let nextSlide = slideB;
        let sliderLoop = null;
        let initialDelayTimeout = null;

        // --- 1. GENEROWANIE SIATKI (GWARANCJA WYPEŁNIENIA) ---
        function generateGrid() {
            gridContainer.innerHTML = '';
            glitchableBlocks = [];
            
            const testSpan = document.createElement('span');
            testSpan.className = 'data-block';
            testSpan.innerText = BASE_NUMBER;
            gridContainer.appendChild(testSpan);
            
            const blockW = testSpan.getBoundingClientRect().width;
            const blockH = testSpan.getBoundingClientRect().height;
            gridContainer.innerHTML = '';
            
            // Wymuszamy o 15% szersze i wyższe pole niż sam ekran, by uciąć brzegi z każdej strony
            const safeWidth = window.innerWidth * 1.15;
            const safeHeight = window.innerHeight * 1.15;
            
            const cols = Math.ceil(safeWidth / blockW);
            const rows = Math.ceil(safeHeight / blockH);
            const totalBlocks = cols * rows;
            
            for(let i = 0; i < totalBlocks; i++) {
                const span = document.createElement('span');
                span.className = 'data-block';
                span.innerText = BASE_NUMBER;
                glitchableBlocks.push(span);
                gridContainer.appendChild(span);
            }
        }

        // --- 2. SILNIK GLITCH (CYFRY) ---
        function glitchRandomBlock() {
            if(!isGridActive || glitchableBlocks.length === 0) return;
            
            const randomBlock = glitchableBlocks[Math.floor(Math.random() * glitchableBlocks.length)];
            let currentVal = 0;
            const targetVal = parseInt(BASE_NUMBER);
            
            const step = Math.floor(Math.random() * 4000) + 1111; 
            const frameRate = Math.floor(Math.random() * (ANIMATION_SPEED_MAX - ANIMATION_SPEED_MIN)) + ANIMATION_SPEED_MIN;

            const interval = setInterval(() => {
                if(!isGridActive) {
                    clearInterval(interval);
                    return;
                }
                
                currentVal += step;
                if (currentVal >= targetVal) {
                    currentVal = targetVal;
                    clearInterval(interval);
                    setTimeout(glitchRandomBlock, Math.random() * 100);
                }
                randomBlock.innerText = currentVal.toString().padStart(5, '0');
                randomBlock.style.color = currentVal < targetVal ? "#ffffff" : "";
            }, frameRate);
        }

        function startGridEngines() {
            isGridActive = true;
            for(let i = 0; i < ACTIVE_THREADS; i++) {
                setTimeout(glitchRandomBlock, Math.random() * 1000);
            }
        }

        function stopGridEngines() {
            isGridActive = false;
        }

        // --- 3. LOGIKA ZDJĘĆ PEŁNOEKRANOWYCH ---
        function changeSlide() {
            const randomImg = IMAGE_FILES[Math.floor(Math.random() * IMAGE_FILES.length)];
            nextSlide.style.backgroundImage = `url('${randomImg}')`;
            
            nextSlide.classList.add('active');
            currentSlide.classList.remove('active');
            
            let temp = currentSlide;
            currentSlide = nextSlide;
            nextSlide = temp;
        }

        function startImagesLoop() {
            changeSlide();
            sliderLoop = setInterval(changeSlide, IMAGE_SHOW_TIME);
        }

        function stopImagesLoop() {
            clearInterval(sliderLoop);
            slideA.classList.remove('active');
            slideB.classList.remove('active');
        }

        // --- 4. AKCJA PLAY / STOP ---
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                isPlaying = true;
                playBtn.innerText = "STOP ";
                
                audio.play().catch(e => console.error(e));

                const docEl = document.documentElement;
                const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                if (requestFS && !document.fullscreenElement) {
                    requestFS.call(docEl).catch(err => console.warn("FS:", err));
                }

                stopGridEngines();
                glitchableBlocks.forEach(block => {
                    setTimeout(() => {
                        block.style.opacity = '0';
                    }, Math.random() * 1500); 
                });

                initialDelayTimeout = setTimeout(() => {
                    startImagesLoop();
                }, DELAY_BEFORE_IMAGES);

            } else {
                isPlaying = false;
                playBtn.innerText = "PLAY ";
                audio.pause();

                clearTimeout(initialDelayTimeout);
                stopImagesLoop();

                glitchableBlocks.forEach(block => {
                    block.innerText = BASE_NUMBER; 
                    block.style.color = "";
                    
                    setTimeout(() => {
                        block.style.opacity = '0.8';
                    }, Math.random() * 1000);
                });

                setTimeout(startGridEngines, 1000);
            }
        });

        // --- 5. INICJALIZACJA ---
        generateGrid();
        startGridEngines();
        
        window.addEventListener('resize', () => {
            if(!isPlaying) {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(() => {
                    generateGrid();
                    startGridEngines();
                }, 200);
            }
        });
    </script>
</body>
</html>
