<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instalacja AV - Atacama (Organic Fade Matrix)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* --- PARAMETRY KONFIGURACYJNE (CSS) --- */
        /* ========================================== */
        :root {
            --bg-color: #000000;
            --text-color: #e2e2e2; 
            --font-main: 'VT323', monospace;
            --grid-font-size: 22px; 
            
            --play-bg: #e2e2e2;
            --play-text: #000000;

            --image-filter: grayscale(100%) contrast(140%);
            --crossfade-duration: 3s; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        html, body {
            width: 100vw; height: 100vh;
            overflow: hidden; 
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            -webkit-text-size-adjust: none; 
        }

        /* --- WARSTWA 1: MATEMATYCZNA SIATKA ABSOLUTNA --- */
        #grid-container {
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .data-block {
            position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-size: var(--grid-font-size);
            letter-spacing: 2px; 
            opacity: 0; /* Startują jako niewidoczne, pokażą się łagodnie */
            white-space: nowrap;
        }

        /* --- WARSTWA 2: PRZYCISKI W CENTRUM --- */
        #playBtn, #stopBtn {
            position: absolute; 
            display: flex; align-items: center; justify-content: center;
            background-color: var(--play-bg);
            color: var(--play-text);
            font-family: var(--font-main);
            font-size: var(--grid-font-size);
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            transition: opacity 1s ease-in-out;
        }

        #playBtn {
            animation: fastPulse 2s infinite ease-in-out;
        }

        #stopBtn {
            display: none; 
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 5px 15px; 
        }

        .pulse-5s {
            animation: pulse5s 10s infinite ease-in-out;
        }

        @keyframes fastPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; } 
        }

        @keyframes pulse5s {
            0%, 40% { opacity: 1; pointer-events: auto; }
            50%, 90% { opacity: 0; pointer-events: none; }
            100% { opacity: 1; pointer-events: auto; }
        }

        /* --- WARSTWA 3: TYPEWRITER TEXT --- */
        #typewriter-container {
            position: fixed; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; 
            text-align: center;
            z-index: 25;
            font-size: 32px; 
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 1;
            text-transform: uppercase;
        }

        .cursor { animation: blink 0.8s infinite; }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* --- WARSTWA 4: PEŁNOEKRANOWE ZDJĘCIA --- */
        #slider-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; 
        }

        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            opacity: 0; 
            transition: opacity var(--crossfade-duration) ease-in-out;
            filter: var(--image-filter);
        }

        .slide.active { opacity: 1; }
    </style>
</head>
<body>

    <script>
        // ==========================================
        // --- PARAMETRY KONFIGURACYJNE (JS) ---
        // ==========================================
        const AUDIO_FILE_URL = "Play Sustain instalacja 5_1.mp3"; 
        const BASE_NUMBER = "39000";
        
        const DENSITY = 80; 
        const ANIMATION_SPEED_MIN = 10; 
        const ANIMATION_SPEED_MAX = 35; 
        
        const IMAGE_SHOW_TIME = 6000; 
        const TYPEWRITER_SPEED = 60; 
        // ==========================================

        const IMAGE_FILES = [];
        for (let i = 12; i <= 21; i++) {
            IMAGE_FILES.push(`Pustynia Atakama${i}.jpeg`);
        }
    </script>

    <!-- UI -->
    <div id="grid-container"></div>
    <div id="playBtn">PLAY</div>
    <div id="stopBtn">STOP</div>
    <div id="typewriter-container"></div>

    <div id="slider-container">
        <div id="slideA" class="slide"></div>
        <div id="slideB" class="slide"></div>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const typewriterContainer = document.getElementById('typewriter-container');
        const slideA = document.getElementById('slideA');
        const slideB = document.getElementById('slideB');
        
        const audio = new Audio();
        audio.src = AUDIO_FILE_URL;
        audio.loop = true;
        audio.crossOrigin = "anonymous";
        audio.volume = 0; 

        let glitchableBlocks = [];
        let isPlaying = false;
        let isGridActive = false; 
        
        let currentSlide = slideA;
        let nextSlide = slideB;
        let sliderLoop = null;
        let fadeAudioInterval = null;
        let abortSequence = false;

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function typeText(phrase) {
            typewriterContainer.innerHTML = '<span id="tw-text"></span><span class="cursor">|</span>';
            const twText = document.getElementById('tw-text');
            for (let i = 0; i < phrase.length; i++) {
                if(abortSequence) return;
                twText.innerHTML += phrase[i];
                await sleep(TYPEWRITER_SPEED);
            }
        }

        async function clearText() {
            typewriterContainer.innerHTML = '';
        }

        function generateExactAbsoluteGrid() {
            gridContainer.innerHTML = '';
            glitchableBlocks = [];
            
            const testSpan = document.createElement('span');
            testSpan.style.fontFamily = "'VT323', monospace";
            testSpan.style.fontSize = "22px";
            testSpan.style.letterSpacing = "2px";
            testSpan.innerText = BASE_NUMBER;
            testSpan.style.position = "absolute";
            testSpan.style.visibility = "hidden";
            document.body.appendChild(testSpan);
            
            const blockW = testSpan.getBoundingClientRect().width;
            const blockH = testSpan.getBoundingClientRect().height * 1.2; 
            document.body.removeChild(testSpan);
            
            const safeWidth = window.innerWidth * 1.15;
            const safeHeight = window.innerHeight * 1.15;
            
            let cols = Math.ceil(safeWidth / blockW);
            let rows = Math.ceil(safeHeight / blockH);
            
            if (cols % 2 === 0) cols++;
            if (rows % 2 === 0) rows++;
            
            const containerW = cols * blockW;
            const containerH = rows * blockH;
            
            gridContainer.style.width = `${containerW}px`;
            gridContainer.style.height = `${containerH}px`;
            
            const centerRow = Math.floor(rows / 2);
            const centerCol = Math.floor(cols / 2);
            
            for(let r = 0; r < rows; r++) {
                for(let c = 0; c < cols; c++) {
                    
                    if (r === centerRow && c === centerCol) {
                        playBtn.style.width = `${blockW}px`;
                        playBtn.style.height = `${blockH}px`;
                        playBtn.style.left = `calc(50% - ${containerW/2}px + ${c * blockW}px)`;
                        playBtn.style.top = `calc(50% - ${containerH/2}px + ${r * blockH}px)`;
                        
                    } else {
                        const span = document.createElement('span');
                        span.className = 'data-block';
                        span.style.width = `${blockW}px`;
                        span.style.height = `${blockH}px`;
                        span.style.left = `${c * blockW}px`;
                        span.style.top = `${r * blockH}px`;
                        span.innerText = BASE_NUMBER;
                        span.dataset.animating = "false";
                        
                        glitchableBlocks.push(span);
                        gridContainer.appendChild(span);
                    }
                }
            }
        }

        // --- SILNIK HAKERSKI (Z MIĘKKIMI PRZEJŚCIAMI) ---
        function runMatrixEngine() {
            if (!isGridActive) return;
            
            setTimeout(() => {
                if(!isGridActive) return;
                
                const randomBlock = glitchableBlocks[Math.floor(Math.random() * glitchableBlocks.length)];
                
                if (randomBlock.dataset.animating === "false") {
                    randomBlock.dataset.animating = "true";
                    
                    // ŁAGODNE WEJŚCIE CYFR Z CIEMNOŚCI
                    randomBlock.style.transition = "opacity 0.6s ease-in, color 0.1s";
                    randomBlock.style.opacity = "1";
                    randomBlock.style.color = "#ffffff";
                    
                    let currentVal = 0;
                    const targetVal = parseInt(BASE_NUMBER);
                    const step = Math.floor(Math.random() * 4000) + 1111; 
                    const frameRate = Math.floor(Math.random() * (ANIMATION_SPEED_MAX - ANIMATION_SPEED_MIN)) + ANIMATION_SPEED_MIN;

                    const interval = setInterval(() => {
                        if(!isGridActive) { 
                            clearInterval(interval); 
                            randomBlock.dataset.animating = "false";
                            return; 
                        }
                        
                        currentVal += step;
                        if (currentVal >= targetVal) {
                            currentVal = targetVal;
                            clearInterval(interval);
                            randomBlock.innerText = currentVal.toString().padStart(5, '0');
                            randomBlock.style.color = "";
                            
                            // ŁAGODNE WYGASZANIE PO ODLICZENIU
                            randomBlock.style.transition = "opacity 1.5s ease-out";
                            randomBlock.style.opacity = "0";
                            setTimeout(() => { randomBlock.dataset.animating = "false"; }, 1500);
                        } else {
                            randomBlock.innerText = currentVal.toString().padStart(5, '0');
                        }
                    }, frameRate);
                }
                
                runMatrixEngine();
            }, Math.random() * (1000 / DENSITY)); 
        }

        function changeSlide() {
            if(abortSequence) return;
            const randomImg = IMAGE_FILES[Math.floor(Math.random() * IMAGE_FILES.length)];
            nextSlide.style.backgroundImage = `url('${randomImg}')`;
            nextSlide.classList.add('active');
            currentSlide.classList.remove('active');
            let temp = currentSlide;
            currentSlide = nextSlide;
            nextSlide = temp;
        }

        async function runMainSequence() {
            abortSequence = false;

            clearInterval(fadeAudioInterval);
            let vol = 0;
            fadeAudioInterval = setInterval(() => {
                vol += 1 / 60; 
                if (vol >= 1) { audio.volume = 1; clearInterval(fadeAudioInterval); } 
                else { audio.volume = vol; }
            }, 50);

            // Czekamy, aż cyfry miękko wygasną i zrobi się pełny blackout
            await sleep(2000);
            if(abortSequence) return;

            await typeText("IN THE ATACAMA DESERT");
            await sleep(1500);
            await clearText();
            if(abortSequence) return;
            await sleep(800);

            await typeText("THERE ARE CURRENTLY");
            await sleep(1500);
            await clearText();
            if(abortSequence) return;
            await sleep(800);

            await typeText("AROUND 39,000 TONS");
            await sleep(1500);
            await clearText();
            if(abortSequence) return;
            await sleep(800);

            await typeText("OF DISCARDED FAST FASHION");
            await sleep(1800);
            await clearText();
            if(abortSequence) return;
            await sleep(800);
            
            await typeText("GROWING BY OVER 100 TONS EVERY DAY");
            await sleep(2200);
            await clearText();
            if(abortSequence) return;
            await sleep(1000); 

            changeSlide();
            sliderLoop = setInterval(changeSlide, IMAGE_SHOW_TIME);
            
            stopBtn.style.display = "flex";
            stopBtn.style.opacity = "0"; // Ukryty startowo
            // Dajemy mikrosekundę przeglądarce na zarejestrowanie display i odpalamy pulse
            setTimeout(() => {
                if(!abortSequence) stopBtn.classList.add("pulse-5s");
            }, 50);
        }

        playBtn.addEventListener('click', () => {
            isPlaying = true;
            playBtn.style.display = "none"; 
            
            audio.volume = 0;
            audio.play().catch(e => console.error(e));

            const docEl = document.documentElement;
            const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFS && !document.fullscreenElement) requestFS.call(docEl);

            // STOP SILNIKÓW I LOSOWY, ZMYSŁOWY RAMP-OUT WSZYSTKICH WIDOCZNYCH CYFR
            isGridActive = false;
            glitchableBlocks.forEach(block => {
                // Tylko te cyfry, które aktualnie są widoczne
                if(block.style.opacity > 0) {
                    setTimeout(() => {
                        block.style.transition = "opacity 1.5s ease-out";
                        block.style.opacity = '0';
                    }, Math.random() * 1500);
                }
            });

            runMainSequence();
        });

        stopBtn.addEventListener('click', () => {
            isPlaying = false;
            abortSequence = true; 
            
            stopBtn.style.display = "none";
            stopBtn.classList.remove("pulse-5s");

            clearInterval(sliderLoop);
            clearText(); 
            
            slideA.classList.remove('active');
            slideB.classList.remove('active');

            clearInterval(fadeAudioInterval);
            let vol = audio.volume;
            fadeAudioInterval = setInterval(() => {
                vol -= 1 / 60;
                if (vol <= 0) {
                    audio.volume = 0;
                    audio.pause();
                    clearInterval(fadeAudioInterval);
                } else { audio.volume = vol; }
            }, 50);

            // Czekamy 3 sekundy aż zdjęcia całkowicie zgasną na fade-out
            setTimeout(() => {
                playBtn.style.display = "flex"; 
                isGridActive = true;
                
                // POWRÓT - Odpalenie silników, które będą miękko, losowo wyprowadzać cyfry z ciemności
                for(let i=0; i<20; i++) runMatrixEngine();
            }, 3000);
        });

        // --- INICJALIZACJA - CZEKAMY NA FONT ---
        document.fonts.ready.then(() => {
            generateExactAbsoluteGrid();
            isGridActive = true;
            for(let i=0; i<20; i++) runMatrixEngine();
        });
        
        window.addEventListener('resize', () => {
            if(!isPlaying) {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(() => {
                    generateExactAbsoluteGrid();
                }, 200);
            }
        });
    </script>
</body>
</html>
