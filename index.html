<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instalacja AV - Atacama (39000 Digits)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* --- PARAMETRY WIZUALNE --- */
        /* ========================================== */
        :root {
            --bg-color: #000000;
            --text-color: #e2e2e2; 
            --font-main: 'VT323', monospace;
            
            /* Kolory przycisku w centrum (negatyw) */
            --play-bg: #e2e2e2;
            --play-text: #000000;
        }
        /* ========================================== */

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            /* Zabezpieczenie wyrównania do środka */
            display: flex; justify-content: center; align-items: center;
        }

        /* --- PERFEKCYJNA SIATKA (CSS GRID) --- */
        #grid-container {
            display: grid;
            width: 100vw; 
            height: 100vh;
            /* Kolumny i rzędy są wstrzykiwane przez algorytm JS */
            line-height: 1;
            text-shadow: 0 0 3px rgba(226, 226, 226, 0.4);
        }

        .data-block {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0.8;
            transition: color 0.1s, opacity 0.1s;
        }

        /* Fizyczny klocek pełniący rolę przycisku */
        #playBtn {
            background-color: var(--play-bg);
            color: var(--play-text);
            text-shadow: none; 
            cursor: pointer;
            opacity: 1 !important;
            font-weight: bold;
        }

        #playBtn:active {
            background-color: #ffffff;
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <script>
        // ==========================================
        // --- PARAMETRY KONFIGURACYJNE (JS) ---
        // ==========================================
        const AUDIO_FILE_URL = "Play Sustain instalacja 5_1.mp3"; 
        
        const BASE_NUMBER = "39000";
        // Wymuszenie DOKŁADNIE 39000 cyfr na ekranie (7800 bloków x 5 cyfr)
        const TOTAL_BLOCKS = 7800; 
        
        const ACTIVE_THREADS = 25; // Ilość jednoczesnych hakerskich losowań
        const ANIMATION_SPEED_MIN = 10; 
        const ANIMATION_SPEED_MAX = 40; 
        // ==========================================
    </script>

    <div id="grid-container"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        
        const audio = new Audio();
        audio.src = AUDIO_FILE_URL;
        audio.loop = true;
        audio.crossOrigin = "anonymous";

        let activeIntervals = []; 
        let glitchableBlocks = [];
        let isPlaying = false;

        // --- 1. MATEMATYKA IDEALNEGO WYPEŁNIENIA ---
        function findBestDivisors(total, aspectTarget) {
            let bestCols = 1;
            let bestRows = total;
            let minDiff = Infinity;
            
            // Szukamy takich dzielników liczby 7800, które najbliżej pasują do proporcji ekranu
            for(let i = 1; i <= total; i++) {
                if(total % i === 0) {
                    let rows = total / i;
                    let currentAspect = i / rows;
                    let diff = Math.abs(currentAspect - aspectTarget);
                    
                    if(diff < minDiff) {
                        minDiff = diff;
                        bestCols = i;
                        bestRows = rows;
                    }
                }
            }
            return { cols: bestCols, rows: bestRows };
        }

        function generateExactMatrix() {
            // Czyszczenie
            activeIntervals.forEach(clearInterval);
            activeIntervals = [];
            glitchableBlocks = [];
            gridContainer.innerHTML = '';
            
            const W = window.innerWidth;
            const H = window.innerHeight;
            const screenAspect = W / H;
            
            // Szacunkowa proporcja pojedynczego bloku "39000" w czcionce VT323
            const charAspect = 0.45; 
            const blockAspect = BASE_NUMBER.length * charAspect; 
            const targetGridAspect = screenAspect / blockAspect;
            
            // Obliczenie idealnej siatki bez reszty
            const gridDims = findBestDivisors(TOTAL_BLOCKS, targetGridAspect);
            
            gridContainer.style.gridTemplateColumns = `repeat(${gridDims.cols}, 1fr)`;
            gridContainer.style.gridTemplateRows = `repeat(${gridDims.rows}, 1fr)`;
            
            // Dynamiczne wyliczenie rozmiaru czcionki, by idealnie wpasowała się w wymiary komórki
            const cellW = W / gridDims.cols;
            const cellH = H / gridDims.rows;
            const maxFontW = cellW / blockAspect;
            const maxFontH = cellH / 0.8; 
            const finalFontSize = Math.min(maxFontW, maxFontH) * 0.95; 
            
            gridContainer.style.fontSize = `${finalFontSize}px`;
            
            // Obliczenie fizycznego środka dla przycisku
            const centerRow = Math.floor(gridDims.rows / 2);
            const centerCol = Math.floor(gridDims.cols / 2);
            const centerIndex = (centerRow * gridDims.cols) + centerCol;
            
            // Rysowanie 7800 bloków (równe 39 000 cyfr)
            for(let i = 0; i < TOTAL_BLOCKS; i++) {
                const span = document.createElement('span');
                span.className = 'data-block';
                
                if (i === centerIndex) {
                    span.innerText = isPlaying ? "STOP" : "PLAY";
                    span.id = "playBtn";
                    
                    // Logika Play/Stop
                    span.addEventListener('click', () => {
                        if (!isPlaying) {
                            audio.play().catch(e => console.error("Audio:", e));
                            span.innerText = "STOP";
                        } else {
                            audio.pause();
                            span.innerText = "PLAY";
                        }
                        isPlaying = !isPlaying;
                    });
                } else {
                    span.innerText = BASE_NUMBER;
                    glitchableBlocks.push(span);
                }
                
                gridContainer.appendChild(span);
            }
            
            startIkedaEngines();
        }

        // --- 2. LOSOWY GLITCH HAKERSKI ---
        function glitchRandomBlock() {
            if(glitchableBlocks.length === 0) return;
            
            const randomBlock = glitchableBlocks[Math.floor(Math.random() * glitchableBlocks.length)];
            let currentVal = 0;
            const targetVal = parseInt(BASE_NUMBER);
            
            const step = Math.floor(Math.random() * 4000) + 1111; 
            const frameRate = Math.floor(Math.random() * (ANIMATION_SPEED_MAX - ANIMATION_SPEED_MIN)) + ANIMATION_SPEED_MIN;

            const interval = setInterval(() => {
                currentVal += step;
                
                if (currentVal >= targetVal) {
                    currentVal = targetVal;
                    clearInterval(interval);
                    setTimeout(glitchRandomBlock, Math.random() * 100);
                }
                
                randomBlock.innerText = currentVal.toString().padStart(BASE_NUMBER.length, '0');
                randomBlock.style.color = currentVal < targetVal ? "#ffffff" : "";
                randomBlock.style.opacity = currentVal < targetVal ? "1" : "0.8";
                
            }, frameRate);
            
            activeIntervals.push(interval);
        }

        function startIkedaEngines() {
            setTimeout(() => {
                for(let i = 0; i < ACTIVE_THREADS; i++) {
                    setTimeout(glitchRandomBlock, Math.random() * 1000);
                }
            }, 100);
        }

        // --- 3. START I REAKCJA NA OBRÓT ---
        generateExactMatrix();
        
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(generateExactMatrix, 200);
        });
    </script>
</body>
</html>
