<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instalacja - RYOJI IKEDA TRIBUTE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: #000; color: #fff;
            /* Monospace, ale ostra i techniczna */
            font-family: 'Courier New', Courier, monospace; 
            font-size: 14px; line-height: 1; letter-spacing: 1px;
            -webkit-text-size-adjust: none;
        }
        #matrix {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; word-break: break-all; opacity: 0.6;
        }
        #ui {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: bold; background: #fff; color: #000;
            padding: 5px 20px; cursor: pointer; z-index: 100;
        }
        #narrative {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8vw; font-weight: bold; text-align: center; white-space: nowrap;
            z-index: 200; display: none; background: #fff; color: #000; padding: 0 20px;
        }
        #slider {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: grayscale(100%) contrast(200%);
            /* Ikeda cięcie na pasy */
            clip-path: polygon(10% 0, 20% 0, 20% 100%, 10% 100%, 30% 0, 32% 0, 32% 100%, 30% 100%, 50% 0, 55% 0, 55% 100%, 50% 100%, 80% 0, 85% 0, 85% 100%, 80% 100%);
            display: none; z-index: 50;
        }
        /* Agresywny stroboskop */
        .strobe { animation: strobe 0.1s infinite; }
        @keyframes strobe { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="matrix"></div>
    <div id="ui">EXECUTE</div>
    <div id="narrative"></div>
    <div id="slider"></div>

    <script>
        const audio = new Audio("Play Sustain instalacja 5_1.mp3");
        audio.loop = true; audio.crossOrigin = "anonymous";
        const images = []; for(let i=12; i<=21; i++) images.push(`Pustynia Atakama${i}.jpeg`);
        
        let matrixActive = true;
        const matrixEl = document.getElementById('matrix');
        const ui = document.getElementById('ui');
        const narrative = document.getElementById('narrative');
        const slider = document.getElementById('slider');
        
        // Silnik wysokiej częstotliwości (60fps data stream)
        function generateDataString() {
            let s = '';
            for(let i=0; i<800; i++) s += Math.random() > 0.5 ? '39000 ' : '00000 ';
            return s;
        }
        
        function drawFrame() {
            if(matrixActive) matrixEl.innerText = generateDataString();
            requestAnimationFrame(drawFrame);
        }
        drawFrame(); // Start data stream

        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        async function flashText(text, duration) {
            narrative.innerText = text;
            narrative.style.display = "block";
            // Inwersja tła na błysk (Ikeda style)
            document.body.style.backgroundColor = "#fff";
            document.body.style.color = "#000";
            await sleep(duration);
            narrative.style.display = "none";
            document.body.style.backgroundColor = "#000";
            document.body.style.color = "#fff";
            await sleep(400); // Twarda czarna przerwa
        }

        ui.addEventListener('click', async () => {
            if(ui.innerText === "EXECUTE") {
                ui.style.display = "none";
                audio.volume = 1; audio.play(); // Twardy start dźwięku
                
                matrixActive = false; matrixEl.innerText = "";
                await sleep(1000);

                // Narracja stroboskopowa
                await flashText("ATACAMA", 150);
                await flashText("39,000 TONS", 150);
                await flashText("FAST FASHION", 150);
                await flashText("+100 TONS / DAY", 150);

                // Odpalenie poszatkowanych zdjęć ze stroboskopem
                slider.style.display = "block";
                slider.classList.add("strobe");
                setInterval(() => {
                    slider.style.backgroundImage = `url('${images[Math.floor(Math.random()*images.length)]}')`;
                    // Dynamiczna zmiana cięć
                    const r1 = Math.random()*20; const r2 = Math.random()*20 + 30; const r3 = Math.random()*20 + 70;
                    slider.style.clipPath = `polygon(${r1}% 0, ${r1+5}% 0, ${r1+5}% 100%, ${r1}% 100%, ${r2}% 0, ${r2+2}% 0, ${r2+2}% 100%, ${r2}% 100%, ${r3}% 0, ${r3+10}% 0, ${r3+10}% 100%, ${r3}% 100%)`;
                }, 300);

                setTimeout(() => { ui.innerText = "TERMINATE"; ui.style.display = "block"; ui.style.background = "red"; ui.style.color = "white"; }, 2000);
            } else {
                window.location.reload(); // Twardy reset
            }
        });
    </script>
</body>
</html>
