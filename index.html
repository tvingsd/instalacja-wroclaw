<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instalacja - ALVA NOTO TRIBUTE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: #000; color: #fff;
            /* Surowa, szwajcarska geometria */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            font-weight: 900; 
            text-transform: uppercase;
        }
        
        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100vw; height: 100vh;
            gap: 2px; background: #222; /* Linie siatki */
            border: 2px solid #222;
        }
        
        .hex-block {
            background: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5vw; letter-spacing: 2px;
            color: #555; /* Zgaszony, techniczny kolor */
        }

        #ui {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            font-size: 18px; padding: 15px 40px; border: 2px solid #fff;
            background: #000; color: #fff; cursor: pointer; z-index: 100;
            letter-spacing: 4px;
        }
        
        #center-data {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 6vw; text-align: center; width: 100%;
            z-index: 200; display: none; background: #000; padding: 20px 0;
            letter-spacing: -2px; /* Zbite litery */
        }

        #slider {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            /* Efekt Threshold (progowy) - ekstremalny kontrast */
            filter: grayscale(100%) contrast(1000%) brightness(1.2);
            display: none; z-index: 50;
            mix-blend-mode: exclusion; /* Noto blendowanie warstw */
        }
    </style>
</head>
<body>
    <div id="grid"></div>
    <div id="center-data"></div>
    <div id="slider"></div>
    <div id="ui">SYSTEM.START()</div>

    <script>
        const audio = new Audio("Play Sustain instalacja 5_1.mp3");
        audio.loop = true; audio.crossOrigin = "anonymous";
        const images = []; for(let i=12; i<=21; i++) images.push(`Pustynia Atakama${i}.jpeg`);
        
        const grid = document.getElementById('grid');
        const ui = document.getElementById('ui');
        const centerData = document.getElementById('center-data');
        const slider = document.getElementById('slider');

        // Generowanie stałych bloków HEX
        for(let i=0; i<32; i++) {
            const b = document.createElement('div');
            b.className = 'hex-block';
            b.innerText = '0x' + Math.floor(Math.random()*16777215).toString(16).toUpperCase().padStart(6, '0');
            grid.appendChild(b);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        ui.addEventListener('click', async () => {
            if(ui.innerText === "SYSTEM.START()") {
                ui.style.display = "none";
                audio.volume = 1; audio.play();

                // Brak fade'ów - twarde bloki danych
                await sleep(1000);
                centerData.style.display = "block";
                
                centerData.innerText = "ATACAMA_DESERT [39.000T]";
                await sleep(2000);
                
                centerData.innerText = "STATUS: FAST_FASHION";
                await sleep(2000);
                
                centerData.innerText = "RATE: +100T/DAY";
                await sleep(2000);
                
                centerData.innerText = "0xFFFFFF"; // Biały szum
                await sleep(500);
                centerData.style.display = "none";

                // Pokaz zdjęć
                slider.style.display = "block";
                setInterval(() => {
                    slider.style.backgroundImage = `url('${images[Math.floor(Math.random()*images.length)]}')`;
                    // Rotacja i inwersja co zmianę
                    slider.style.transform = Math.random() > 0.5 ? "scaleX(-1)" : "scaleX(1)";
                }, 4000);

                setTimeout(() => { ui.innerText = "SYSTEM.HALT()"; ui.style.display = "block"; }, 2000);
            } else {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
