<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalacja AV - Atacama</title>
    <style>
        :root {
            --global-object-size: 150px; 
            --bg-color: #000000;         
            --btn-color: #ffffff;        
            --text-color: #000000;       
            --info-text-color: #ffffff;  
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #playBtn {
            width: var(--global-object-size);
            height: var(--global-object-size);
            background-color: var(--btn-color);
            color: var(--text-color);
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, opacity 0.3s;
            z-index: 10;
        }

        #playBtn:active {
            transform: scale(0.95);
        }

        #videoPlayer {
            display: none;
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }

        #audioInfo {
            display: none;
            color: var(--info-text-color);
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <script>
        const VIDEO_FILE_URL = "ATACAMA_FINAL_SMOOTH_MORPH.mp4";
        const AUDIO_FILE_URL = "Wystawa_PS_sound.mp3"; 
        const DEFAULT_TO_VIDEO_ON_UNKNOWN = true; 
    </script>

    <button id="playBtn">PLAY</button>
    
    <video id="videoPlayer" playsinline loop muted></video>
    <div id="audioInfo">Audio Experience<br><span style="font-size: 10px; opacity: 0.4; letter-spacing: 1px;">Słabsze łącze – ładujemy tylko dźwięk</span></div>

    <script>
        const btn = document.getElementById('playBtn');
        const video = document.getElementById('videoPlayer');
        const audioInfo = document.getElementById('audioInfo');
        
        const audio = new Audio();
        audio.loop = true;

        let isFastConnection = DEFAULT_TO_VIDEO_ON_UNKNOWN;
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        
        if (connection && connection.effectiveType) {
            if (connection.effectiveType === '4g') {
                isFastConnection = true;
            } else {
                isFastConnection = false;
            }
        }

        let isPlaying = false;

        btn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.src = AUDIO_FILE_URL;
                audio.play();

                if (isFastConnection) {
                    video.src = VIDEO_FILE_URL;
                    video.style.display = 'block';
                    btn.style.display = 'none';
                    video.play();
                } else {
                    audioInfo.style.display = 'block';
                    btn.innerText = "STOP";
                }
            } else {
                audio.pause();
                if (isFastConnection) {
                    video.pause();
                } else {
                    btn.innerText = "PLAY";
                }
            }
            isPlaying = !isPlaying;
        });

        video.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                audio.play();
            } else {
                video.pause();
                audio.pause();
            }
        });
    </script>
</body>
</html>
