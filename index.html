<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instalacja AV - Atacama (Perfect Sync)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* --- PARAMETRY KONFIGURACYJNE (CSS) --- */
        /* ========================================== */
        :root {
            --bg-color: #000000;
            --text-color: #e2e2e2; 
            --font-main: 'VT323', monospace;
            
            --grid-font-size: 22px; 
            --grid-line-height: 1.1; 
            
            --play-bg: #e2e2e2;
            --play-text: #000000;

            --image-filter: grayscale(100%) contrast(140%);
            --crossfade-duration: 3s; 
        }
        /* ========================================== */

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html {
            width: 100vw; height: 100vh;
            overflow: hidden; 
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
        }

        /* --- WARSTWA 1: MATEMATYCZNA SIATKA CSS GRID --- */
        #grid-container {
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: grid; /* Zmiana na twardy Grid */
            justify-content: center; align-content: center;
            text-shadow: 0 0 3px rgba(226, 226, 226, 0.4);
            z-index: 10;
        }

        .data-block {
            display: flex; align-items: center; justify-content: center;
            width: 5ch; height: var(--grid-line-height); line-height: var(--grid-line-height);
            font-size: var(--grid-font-size);
            opacity: 0.8;
            /* Zostawiamy bazowy color, opacity będzie sterowane z JS dla dokładnego timingu */
            transition: color 0.1s; 
        }

        /* --- WARSTWA CENTRUM (PRZYCISK W GRIDZIE) --- */
        .center-wrapper {
            position: relative;
            cursor: pointer;
            opacity: 1 !important; 
        }

        .layer-glitch {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        .layer-btn {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background-color: var(--play-bg);
            color: var(--play-text);
            text-shadow: none; 
            font-weight: bold;
            /* Puls: 1 sek zapalanie, 1 sek gaśnięcie = 2s cykl na ease-in-out */
            animation: fastPulse 2s infinite ease-in-out;
            pointer-events: none; 
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        @keyframes fastPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; } 
        }

        /* --- WARSTWA 2: PEŁNOEKRANOWE ZDJĘCIA --- */
        #slider-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; 
        }

        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0; 
            transition: opacity var(--crossfade-duration) ease-in-out;
            filter: var(--image-filter);
        }

        .slide.active { opacity: 1; }
    </style>
</head>
<body>

    <script>
        // ==========================================
        // --- PARAMETRY KONFIGURACYJNE (JS) ---
        // ==========================================
        const AUDIO_FILE_URL = "Play Sustain instalacja 5_1.mp3"; 
        const BASE_NUMBER = "39000";
        
        const ACTIVE_THREADS = 40; 
        const ANIMATION_SPEED_MIN = 10; 
        const ANIMATION_SPEED_MAX = 40; 
        
        const IMAGE_SHOW_TIME = 6000; // Czas ekspozycji jednego zdjęcia (6 sekund)
        // ==========================================

        const IMAGE_FILES = [];
        for (let i = 12; i <= 21; i++) {
            IMAGE_FILES.push(`Pustynia Atakama${i}.jpeg`);
        }
    </script>

    <div id="grid-container"></div>
    
    <div id="slider-container">
        <div id="slideA" class="slide"></div>
        <div id="slideB" class="slide"></div>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const slideA = document.getElementById('slideA');
        const slideB = document.getElementById('slideB');
        
        const audio = new Audio();
        audio.src = AUDIO_FILE_URL;
        audio.loop = true;
        audio.crossOrigin = "anonymous";
        audio.volume = 0; // Startujemy od zera

        let activeIntervals = []; 
        let glitchableBlocks = [];
        let isPlaying = false;
        let isGridActive = true; 
        let btnLayerElement = null;
        
        let currentSlide = slideA;
        let nextSlide = slideB;
        let sliderLoop = null;
        let timeoutFlow = null;
        let fadeAudioInterval = null;

        // --- 1. GENEROWANIE IDEALNEJ SIATKI ---
        function generateGrid() {
            gridContainer.innerHTML = '';
            glitchableBlocks = [];
            
            const testSpan = document.createElement('span');
            testSpan.className = 'data-block';
            testSpan.innerText = BASE_NUMBER;
            gridContainer.appendChild(testSpan);
            
            const blockW = testSpan.getBoundingClientRect().width;
            const blockH = testSpan.getBoundingClientRect().height;
            gridContainer.innerHTML = '';
            
            // Wymuszamy bezpieczny margines za ekran
            const safeWidth = window.innerWidth * 1.15;
            const safeHeight = window.innerHeight * 1.15;
            
            // Obliczamy DOKŁADNĄ liczbę kolumn i rzędów
            let cols = Math.ceil(safeWidth / blockW);
            let rows = Math.ceil(safeHeight / blockH);
            
            // Gwarancja IDEALNEGO ŚRODKA - liczby nieparzyste
            if (cols % 2 === 0) cols++;
            if (rows % 2 === 0) rows++;
            
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 5ch)`;
            gridContainer.style.gridTemplateRows = `repeat(${rows}, ${blockH}px)`;
            
            const totalBlocks = cols * rows;
            const centerIndex = Math.floor(totalBlocks / 2); // To punkt idealnie na środku matrycy
            
            for(let i = 0; i < totalBlocks; i++) {
                if (i === centerIndex) {
                    // --- ZINTEGROWANY PRZYCISK PLAY ---
                    const wrapper = document.createElement('span');
                    wrapper.className = 'data-block center-wrapper';
                    wrapper.style.zIndex = "100";
                    
                    const glitchLayer = document.createElement('span');
                    glitchLayer.className = 'layer-glitch';
                    glitchLayer.innerText = BASE_NUMBER;
                    
                    const btnLayer = document.createElement('span');
                    btnLayer.className = 'layer-btn';
                    btnLayer.innerText = isPlaying ? "STOP " : "PLAY ";
                    btnLayerElement = btnLayer; 
                    
                    wrapper.appendChild(glitchLayer);
                    wrapper.appendChild(btnLayer);
                    gridContainer.appendChild(wrapper);

                    runCenterGlitch(glitchLayer);

                    // --- LOGIKA KLIKNIĘCIA ---
                    wrapper.addEventListener('click', handlePlayStop);

                } else {
                    const span = document.createElement('span');
                    span.className = 'data-block';
                    span.innerText = BASE_NUMBER;
                    glitchableBlocks.push(span);
                    gridContainer.appendChild(span);
                }
            }
        }

        // --- HAKERY ---
        function runCenterGlitch(element) {
            const targetVal = parseInt(BASE_NUMBER);
            function runCycle() {
                let currentVal = 0;
                const step = Math.floor(Math.random() * 3500) + 1111; 
                const frameRate = Math.floor(Math.random() * 20) + 15; 
                const interval = setInterval(() => {
                    currentVal += step;
                    if (currentVal >= targetVal) {
                        currentVal = targetVal;
                        element.innerText = currentVal.toString().padStart(5, '0');
                        element.style.color = "";
                        clearInterval(interval);
                        setTimeout(runCycle, Math.random() * 2000 + 500);
                    } else {
                        element.innerText = currentVal.toString().padStart(5, '0');
                        element.style.color = "#ffffff";
                    }
                }, frameRate);
            }
            runCycle();
        }

        function glitchRandomBlock() {
            if(!isGridActive || glitchableBlocks.length === 0) return;
            const randomBlock = glitchableBlocks[Math.floor(Math.random() * glitchableBlocks.length)];
            let currentVal = 0;
            const targetVal = parseInt(BASE_NUMBER);
            const step = Math.floor(Math.random() * 4000) + 1111; 
            const frameRate = Math.floor(Math.random() * (ANIMATION_SPEED_MAX - ANIMATION_SPEED_MIN)) + ANIMATION_SPEED_MIN;

            const interval = setInterval(() => {
                if(!isGridActive) { clearInterval(interval); return; }
                currentVal += step;
                if (currentVal >= targetVal) {
                    currentVal = targetVal;
                    clearInterval(interval);
                    setTimeout(glitchRandomBlock, Math.random() * 100);
                }
                randomBlock.innerText = currentVal.toString().padStart(5, '0');
                randomBlock.style.color = currentVal < targetVal ? "#ffffff" : "";
            }, frameRate);
        }

        function startGridEngines() {
            isGridActive = true;
            for(let i = 0; i < ACTIVE_THREADS; i++) {
                setTimeout(glitchRandomBlock, Math.random() * 1000);
            }
        }

        // --- ZDJĘCIA ---
        function changeSlide() {
            const randomImg = IMAGE_FILES[Math.floor(Math.random() * IMAGE_FILES.length)];
            nextSlide.style.backgroundImage = `url('${randomImg}')`;
            nextSlide.classList.add('active');
            currentSlide.classList.remove('active');
            let temp = currentSlide;
            currentSlide = nextSlide;
            nextSlide = temp;
        }

        // --- LOGIKA PLAY / STOP ---
        function handlePlayStop() {
            if (!isPlaying) {
                // *** 1. START DOŚWIADCZENIA ***
                isPlaying = true;
                btnLayerElement.innerText = "STOP ";
                
                // Obejście blokady Apple - odtwarzamy od razu wyciszone po kliknięciu
                audio.volume = 0;
                audio.play().catch(e => console.error(e));

                const docEl = document.documentElement;
                const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                if (requestFS && !document.fullscreenElement) requestFS.call(docEl);

                // Zatrzymanie maszyn i Random Fade-Out (trwa max 1.5s)
                isGridActive = false;
                glitchableBlocks.forEach(block => {
                    block.style.transition = "opacity 1.5s ease-out, color 0.1s";
                    setTimeout(() => { block.style.opacity = '0'; }, Math.random() * 1500); 
                });

                // Czekamy 2500ms (1.5s wygaszanie + 1.0s absolutny blackout)
                timeoutFlow = setTimeout(() => {
                    // START AUDIO RAMP-UP (3s = 60 kroków po 50ms)
                    clearInterval(fadeAudioInterval);
                    let vol = 0;
                    fadeAudioInterval = setInterval(() => {
                        vol += 1 / 60; 
                        if (vol >= 1) { audio.volume = 1; clearInterval(fadeAudioInterval); } 
                        else { audio.volume = vol; }
                    }, 50);

                    // Włączenie pokazu slajdów (też wchodzą na 3s fade in przez CSS)
                    changeSlide();
                    sliderLoop = setInterval(changeSlide, IMAGE_SHOW_TIME);
                }, 2500); 

            } else {
                // *** 2. STOP (POWRÓT DO MATRYCY) ***
                isPlaying = false;
                btnLayerElement.innerText = "PLAY ";

                clearTimeout(timeoutFlow);
                clearInterval(sliderLoop);
                
                // Zatrzymanie zdjęć (Fade Out przez klasę zajmie równe 3 sekundy)
                slideA.classList.remove('active');
                slideB.classList.remove('active');

                // AUDIO RAMP-DOWN (3s)
                clearInterval(fadeAudioInterval);
                let vol = audio.volume;
                fadeAudioInterval = setInterval(() => {
                    vol -= 1 / 60;
                    if (vol <= 0) {
                        audio.volume = 0;
                        audio.pause();
                        clearInterval(fadeAudioInterval);
                    } else { audio.volume = vol; }
                }, 50);

                // FADE IN CYFR (3s)
                glitchableBlocks.forEach(block => {
                    block.innerText = BASE_NUMBER; 
                    block.style.color = "";
                    block.style.transition = "opacity 3s ease-out, color 0.1s"; // Ramp-up na wzrok
                    setTimeout(() => { block.style.opacity = '0.8'; }, 100); 
                });

                // Po 3 sekundach pełnego pojawienia ruszają znów silniki hakerskie
                setTimeout(startGridEngines, 3000);
            }
        }

        // --- INICJALIZACJA ---
        generateGrid();
        startGridEngines();
        
        window.addEventListener('resize', () => {
            if(!isPlaying) {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(() => {
                    generateGrid();
                    startGridEngines();
                }, 200);
            }
        });
    </script>
</body>
</html>
